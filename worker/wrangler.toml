# Contact-form relay for grandfathershoney.com.
# Deploy from this directory with: npx wrangler deploy
# (log in to the Cloudflare account that owns the grandfathershoney.com zone)
name = "grandfathershoney-contact"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Workers custom domain — Cloudflare creates and owns the DNS record on deploy.
routes = [
  { pattern = "api.grandfathershoney.com", custom_domain = true }
]

[vars]
SITE_NAME = "Grandfather's Honey"
# Alias credentials for the Forward Email REST API (api.forwardemail.net/v1/emails).
# Scoped to this one mailbox -- deliberately NOT the account-wide API token, which
# would let a leak here send as any of the ~22 domains in the account.
FE_API_USER = "noreply@grandfathershoney.com"
MAIL_FROM = "noreply@grandfathershoney.com"
MAIL_TO = "michal@grandfathershoney.com"
ALLOWED_ORIGINS = "https://grandfathershoney.com,https://www.grandfathershoney.com"

# Secrets — set from Proton Pass, never committed (DEVSTANDARDS §6/§16):
#   npx wrangler secret put FE_API_PASS        # Proton Pass: Forward Email [grandfathershoney.com]
#   npx wrangler secret put TURNSTILE_SECRET   # Proton Pass: cloudflare/turnstile-clients
