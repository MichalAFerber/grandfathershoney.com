# Site settings
title: Grandfather's Honey
description: Small-scale beekeeping & honey production in rural South Carolina honoring Lorenzo Lorraine Langstroth.
url: "https://grandfathershoney.com"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude from processing
exclude:
  - OLD_WEBSITE
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - worker

# Collections
collections:
  books:
    output: false

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Plugins for GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Social links
social:
  name: Grandfather's Honey

# Contact form (first-party; posts to the Cloudflare Worker in /worker,
# which relays via Forward Email SMTP)
contact:
  endpoint: https://api.grandfathershoney.com/contact
  email: michal@grandfathershoney.com
  # Cloudflare Turnstile sitekey (public by design). Widget "Clients" in the
  # TechGuyWithABeard account; its secret lives in Proton Pass as
  # cloudflare/turnstile-clients.
  turnstile_sitekey: "0x4AAAAAAD-B7hIU5QqSXReP"
