name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Only the source checkout is needed now; the GitHub Pages id-token/pages
# permissions went away with the Pages deployment.
permissions:
  contents: read

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # No --baseurl: the site is served from the domain root on Pages, and
      # _config.yml already sets `baseurl: ""`.
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=grandfathershoney-com --branch=main
